const tmo=(p,ms)=>Promise.race([Promise.resolve(p),new Promise((_,j)=>setTimeout(j,ms))]);
async function st(){if(DB===null){try{DB=(typeof claude!='undefined'&&await tmo(claude.use('db'),3000))||0}catch(e){DB=0}}return DB}
async function lbGet(){let L=lget('lb')||[];try{const d=await st();if(d){const q=await tmo(d.collection('leaderboard').limit(200).get(),4000);L=L.concat(q.docs.map(z=>z.data()))}}catch(e){}
 const m={};L.forEach(e=>{if(!e||!(e.ms>0))return;const k=String(e.name).toLowerCase();if(!m[k]||m[k].ms>e.ms)m[k]=e});return Object.values(m).sort((p,q)=>p.ms-q.ms)}
